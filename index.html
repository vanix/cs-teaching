<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計算機概論教學網站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .unit-card {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .unit-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(56, 189, 248, 0.35);
            border-color: #38bdf8;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-slate-950/80 backdrop-blur-md border-b border-indigo-900/50 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-400 to-indigo-500 flex items-center justify-center text-slate-950 text-2xl shadow-lg shadow-sky-500/20">
                <i class="fa-solid fa-microchip"></i>
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-black tracking-wide">計算機概論教學網站</h1>
                <p class="text-slate-400 text-sm">透過遊戲，快樂學習計概！</p>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-10">
        <h2 class="text-xl md:text-2xl font-bold mb-6 flex items-center gap-2">
            <i class="fa-solid fa-gamepad text-amber-400"></i> 學習遊戲
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <!-- 單元一：湊點數 -->
            <a href="1_湊點數.html" class="unit-card bg-slate-900/70 border border-slate-700 rounded-3xl p-6 flex flex-col gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-400 to-emerald-500 flex items-center justify-center text-slate-950 text-2xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-emerald-400 bg-emerald-400/10 border border-emerald-400/30 rounded-full px-3 py-1">單元一</span>
                    <h3 class="text-xl font-black mt-3">二進位點數卡片遊戲</h3>
                    <p class="text-slate-400 text-sm mt-1">翻牌湊出 0 ~ 31 的數字，練習二進位表示法。</p>
                </div>
                <span class="mt-auto inline-flex items-center gap-2 text-sky-400 font-bold text-sm">
                    開始遊戲 <i class="fa-solid fa-arrow-right"></i>
                </span>
            </a>

            <!-- 單元二：進位換算 -->
            <a href="2_進位換算.html" class="unit-card bg-slate-900/70 border border-slate-700 rounded-3xl p-6 flex flex-col gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-400 to-amber-500 flex items-center justify-center text-slate-950 text-2xl shadow-lg shadow-amber-500/20">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-amber-400 bg-amber-400/10 border border-amber-400/30 rounded-full px-3 py-1">單元二</span>
                    <h3 class="text-xl font-black mt-3">進位解密大作戰</h3>
                    <p class="text-slate-400 text-sm mt-1">2 進位轉 8 / 16 進位，用點數卡片理解進位換算。</p>
                </div>
                <span class="mt-auto inline-flex items-center gap-2 text-sky-400 font-bold text-sm">
                    開始遊戲 <i class="fa-solid fa-arrow-right"></i>
                </span>
            </a>

            <!-- 單元三：摩斯電碼二進位 -->
            <a href="3_摩斯電碼二進位.html" class="unit-card bg-slate-900/70 border border-slate-700 rounded-3xl p-6 flex flex-col gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-rose-400 to-rose-500 flex items-center justify-center text-slate-950 text-2xl shadow-lg shadow-rose-500/20">
                    <i class="fa-solid fa-tower-broadcast"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-rose-400 bg-rose-400/10 border border-rose-400/30 rounded-full px-3 py-1">單元三</span>
                    <h3 class="text-xl font-black mt-3">摩斯二進位電報解碼戰</h3>
                    <p class="text-slate-400 text-sm mt-1">聽音解碼或發射電報，用摩斯聲音對照二進位卡片解碼。</p>
                </div>
                <span class="mt-auto inline-flex items-center gap-2 text-sky-400 font-bold text-sm">
                    開始遊戲 <i class="fa-solid fa-arrow-right"></i>
                </span>
            </a>

            <!-- 單元四：字母解碼 -->
            <a href="4_字母解碼.html" class="unit-card bg-slate-900/70 border border-slate-700 rounded-3xl p-6 flex flex-col gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-violet-400 to-violet-500 flex items-center justify-center text-slate-950 text-2xl shadow-lg shadow-violet-500/20">
                    <i class="fa-solid fa-font"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-violet-400 bg-violet-400/10 border border-violet-400/30 rounded-full px-3 py-1">單元四</span>
                    <h3 class="text-xl font-black mt-3">摩斯二進位字母解碼戰</h3>
                    <p class="text-slate-400 text-sm mt-1">用摩斯聲音對應 A ~ Z 字母，包含聽音與單字解碼關卡。</p>
                </div>
                <span class="mt-auto inline-flex items-center gap-2 text-sky-400 font-bold text-sm">
                    開始遊戲 <i class="fa-solid fa-arrow-right"></i>
                </span>
            </a>

            <!-- 單元五：亂碼解碼實驗室 -->
            <a href="5_亂碼解碼實驗室.html" class="unit-card bg-slate-900/70 border border-slate-700 rounded-3xl p-6 flex flex-col gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-400 to-cyan-500 flex items-center justify-center text-slate-950 text-2xl shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-flask"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-cyan-400 bg-cyan-400/10 border border-cyan-400/30 rounded-full px-3 py-1">單元五</span>
                    <h3 class="text-xl font-black mt-3">亂碼解碼實驗室</h3>
                    <p class="text-slate-400 text-sm mt-1">自訂編碼表，體驗編碼不匹配時產生亂碼的原理。</p>
                </div>
                <span class="mt-auto inline-flex items-center gap-2 text-sky-400 font-bold text-sm">
                    開始遊戲 <i class="fa-solid fa-arrow-right"></i>
                </span>
            </a>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950/80 border-t border-indigo-900/50 py-6 text-center text-slate-500 text-sm">
        計算機概論教學網站 &copy; 2026
    </footer>

</body>
</html>
