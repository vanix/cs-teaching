<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摩斯二進位電報解碼戰 (Morse-Binary Cipher)</title>
    <meta name="description" content="聽音解碼或發射電報，用摩斯聲音對照二進位卡片解碼。結合摩斯電碼與二進位的互動遊戲。">
    <meta name="keywords" content="摩斯電碼, 二進位, 電報解碼, 計算機概論, 編碼, 遊戲學習">
    <meta name="robots" content="index, follow">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8522276249008152" crossorigin="anonymous"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            900: '#0B132B',
                            800: '#1C2541',
                            700: '#3A506B',
                            amber: '#FFB703',
                            green: '#06D6A0',
                            red: '#EF476F',
                        }
                    },
                    fontFamily: {
                        mono: ['Courier New', 'monospace'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pulse-light {
            0%, 100% { opacity: 0.2; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 12px #FFB703); }
        }

        .signal-active {
            animation: pulse-light 0.2s ease-in-out infinite;
            background-color: #FFB703 !important;
            box-shadow: 0 0 15px #FFB703, 0 0 30px #FFB703;
        }

        .dot-card {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            touch-action: manipulation;
        }

        .dot-card:hover {
            transform: translateY(-4px);
        }

        .dot-card.selected {
            transform: translateY(-8px) scale(1.02);
            border-color: #06D6A0;
            box-shadow: 0 10px 25px -5px rgba(6, 214, 160, 0.4);
            background-color: rgba(6, 214, 160, 0.1);
        }

        /* Scanline effect for cyber telegraph theme */
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-amber-500 selection:text-slate-950">

    <header class="w-full max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center font-mono font-bold text-amber-400 text-xl shadow-lg shadow-amber-500/10">
                📻
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-black tracking-tight text-amber-400 font-mono">摩斯二進位電報戰</h1>
                <p class="text-xs text-slate-400">長音＝1 (選卡) | 短音＝0 (不選) | 5音一組 decoder</p>
            </div>
        </div>

        <!-- Mode Toggle -->
        <div class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
            <button id="btn-mode-listen" onclick="switchMode('listen')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-amber-500 text-slate-950 font-bold shadow">
                🎧 聽音解碼模式
            </button>
            <button id="btn-mode-transmit" onclick="switchMode('transmit')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition">
                📻 電報發射模式
            </button>
        </div>
    </header>

    <main class="w-full max-w-4xl mx-auto px-4 py-6 flex-1 flex flex-col justify-between items-center gap-6">

        <!-- Top Status & Audio Control Box -->
        <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-5 backdrop-blur relative overflow-hidden shadow-2xl">
            <div class="scanline absolute inset-0 pointer-events-none opacity-20"></div>

            <div class="flex flex-col sm:flex-row items-center justify-between gap-6 relative z-10">
                
                <!-- Target Display -->
                <div class="text-center sm:text-left flex-1">
                    <span id="target-label" class="text-xs font-mono uppercase tracking-widest text-amber-500 font-bold block mb-1">▶ 目標訊號 (Target)</span>
                    <div id="target-display-box" class="flex items-center justify-center sm:justify-start gap-3">
                        <button id="btn-play-sound" onclick="playCurrentMorseSequence()" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm flex items-center gap-2 shadow-lg shadow-amber-500/20 active:scale-95 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15.536a5 5 0 001.414 1.414m2.828-9.9a9 9 0 0112.728 0M12 6v12l-5-5H3V11h4l5-5z"></path></svg>
                            播放摩斯音訊 (Space)
                        </button>
                        <span id="target-number-text" class="hidden text-4xl sm:text-5xl font-black font-mono text-emerald-400">?</span>
                    </div>
                </div>

                <!-- Signal Indicators (5 LED Lights) -->
                <div class="flex flex-col items-center">
                    <span class="text-[10px] font-mono text-slate-400 uppercase tracking-wider mb-2">訊號即時燈號 (16 - 8 - 4 - 2 - 1)</span>
                    <div class="flex items-center gap-3 bg-slate-950 px-4 py-2.5 rounded-xl border border-slate-800">
                        <div id="led-0" class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-150"></div>
                        <div id="led-1" class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-150"></div>
                        <div id="led-2" class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-150"></div>
                        <div id="led-3" class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-150"></div>
                        <div id="led-4" class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-150"></div>
                    </div>
                </div>

                <!-- Score / Streak -->
                <div class="flex items-center gap-4 text-center">
                    <div>
                        <span class="text-[10px] font-mono text-slate-400 block uppercase">得分</span>
                        <span id="score-val" class="text-3xl font-black font-mono text-amber-400">0</span>
                    </div>
                    <div class="pl-4 border-l border-slate-800">
                        <span class="text-[10px] font-mono text-slate-400 block uppercase">連勝</span>
                        <span id="streak-val" class="text-3xl font-black font-mono text-emerald-400">0</span>
                    </div>
                </div>
            </div>

            <!-- Speed Control bar -->
            <div class="mt-4 pt-3 border-t border-slate-800/80 flex flex-wrap items-center justify-between text-xs text-slate-400 gap-2">
                <div class="flex items-center gap-2">
                    <span>播放速度：</span>
                    <button onclick="setSpeed(300)" id="speed-slow" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300">慢</button>
                    <button onclick="setSpeed(200)" id="speed-mid" class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/40">標準</button>
                    <button onclick="setSpeed(120)" id="speed-fast" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300">快</button>
                </div>
                <div class="flex items-center gap-2">
                    <label class="cursor-pointer flex items-center gap-1.5">
                        <input type="checkbox" id="chk-show-hint" onchange="toggleHint(this.checked)" class="rounded bg-slate-800 border-slate-700 text-amber-500 focus:ring-0">
                        <span>顯示波形符號 (長/短)</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Waveform Hint Box (Optional Visual) -->
        <div id="morse-visual-box" class="w-full bg-slate-900/40 border border-slate-800/60 rounded-xl p-3 text-center font-mono text-lg tracking-widest text-amber-400 min-h-[48px] flex items-center justify-center gap-3">
            <span class="text-xs text-slate-500 font-sans">音效提示符號：</span>
            <span id="morse-symbols-display" class="font-bold text-xl text-amber-300">---</span>
        </div>

        <div class="w-full flex flex-col items-center gap-3">
            <div id="cards-container" class="w-full flex justify-center gap-2 sm:gap-4 my-2">
                <!-- 5 Binary Cards dynamically rendered -->
            </div>

            <!-- Current Sum & Binary Output Bar -->
            <div class="w-full bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <span class="text-xs font-mono text-slate-400 uppercase">選取二進位：</span>
                    <span id="binary-code-text" class="font-mono text-xl font-bold tracking-widest text-emerald-400">0 0 0 0 0</span>
                </div>
                
                <div class="flex items-center gap-3">
                    <span class="text-xs font-mono text-slate-400 uppercase">目前點數總和：</span>
                    <span id="current-sum-text" class="font-mono text-3xl font-black text-amber-400">0</span>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="clearCards()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">
                        清空 (R)
                    </button>
                    <button onclick="submitAnswer()" class="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-sm font-extrabold shadow-lg shadow-emerald-500/20 active:scale-95 transition">
                        確認送出 (Enter)
                    </button>
                </div>
            </div>
        </div>

        <!-- Rules & Morse Legend Guide -->
        <div class="w-full bg-slate-900/30 rounded-2xl p-4 border border-slate-800/60 text-slate-400 text-xs leading-relaxed">
            <h3 class="font-mono font-bold text-amber-400 mb-2 flex items-center gap-2">
                <span>💡 摩斯二進位對照表</span>
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 font-mono text-slate-300">
                <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                    <p class="text-amber-400 font-bold mb-1">➖ 長音 (Dah / 高音)</p>
                    <p class="text-[11px] text-slate-400">代表二進位 <b>1</b>，即「需要該卡片點數」。</p>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                    <p class="text-sky-400 font-bold mb-1">▪ 短音 (Dit / 低音)</p>
                    <p class="text-[11px] text-slate-400">代表二進位 <b>0</b>，即「不需要該卡片點數」。</p>
                </div>
            </div>
        </div>

    </main>

    <footer class="w-full max-w-5xl mx-auto px-4 py-4 text-center text-xs text-slate-600 border-t border-slate-800/60 font-mono">
        摩斯二進位解碼戰 | 鍵盤 1~5 翻牌 • Space 播音 • Enter 送出
    </footer>

    <script>
        // Game State Variables
        const cardValues = [16, 8, 4, 2, 1];
        let cardStates = [false, false, false, false, false];
        let currentTargetNumber = 0;
        let gameMode = 'listen'; // 'listen' or 'transmit'
        let score = 0;
        let streak = 0;
        let showHint = false;
        let unitTime = 200; // ms per dot unit

        // Web Audio Context setup
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Set playback speed
        function setSpeed(speedMs) {
            unitTime = speedMs;
            document.getElementById('speed-slow').className = speedMs === 300 ? "px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/40" : "px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300";
            document.getElementById('speed-mid').className = speedMs === 200 ? "px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/40" : "px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300";
            document.getElementById('speed-fast').className = speedMs === 120 ? "px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/40" : "px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300";
        }

        function toggleHint(enabled) {
            showHint = enabled;
            updateMorseVisual();
        }

        // Generate sound tone (Dah vs Dit)
        function playTone(freq, duration) {
            return new Promise((resolve) => {
                try {
                    initAudio();
                    if (!audioCtx) { resolve(); return; }

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration / 1000));

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    setTimeout(() => {
                        osc.stop();
                        resolve();
                    }, duration);
                } catch(e) {
                    resolve();
                }
            });
        }

        async function playMorseSequence(number) {
            const btn = document.getElementById('btn-play-sound');
            if (btn) btn.disabled = true;

            // Convert number to 5-bit binary string
            const binStr = number.toString(2).padStart(5, '0');

            for (let i = 0; i < 5; i++) {
                const bit = binStr[i];
                const led = document.getElementById(`led-${i}`);

                // Light up LED
                if (led) led.classList.add('signal-active');

                if (bit === '1') {
                    // Dah (Long Tone - High pitch)
                    await playTone(750, unitTime * 2.2);
                } else {
                    // Dit (Short Tone - Lower pitch)
                    await playTone(450, unitTime * 0.8);
                }

                // Turn off LED
                if (led) led.classList.remove('signal-active');

                // Pause between tones
                await new Promise(r => setTimeout(r, unitTime * 0.8));
            }

            if (btn) btn.disabled = false;
        }

        function playCurrentMorseSequence() {
            playMorseSequence(currentTargetNumber);
        }

        function buildDotsHTML(val) {
            if (val === 16) {
                return `<div class="w-full h-full grid grid-cols-4 grid-rows-4 gap-1 p-1 place-items-center">
                    ${'<div class="w-2.5 h-2.5 bg-slate-900 rounded-full"></div>'.repeat(16)}
                </div>`;
            } else if (val === 8) {
                return `<div class="w-full h-full grid grid-cols-2 grid-rows-4 gap-1 p-1 place-items-center">
                    ${'<div class="w-3 h-3 bg-slate-900 rounded-full"></div>'.repeat(8)}
                </div>`;
            } else if (val === 4) {
                return `<div class="w-full h-full grid grid-cols-2 grid-rows-2 gap-1 p-2 place-items-center">
                    ${'<div class="w-3.5 h-3.5 bg-slate-900 rounded-full"></div>'.repeat(4)}
                </div>`;
            } else if (val === 2) {
                return `<div class="w-full h-full grid grid-cols-2 grid-rows-2 gap-1 p-2 place-items-center">
                    <div></div><div class="w-3.5 h-3.5 bg-slate-900 rounded-full"></div>
                    <div class="w-3.5 h-3.5 bg-slate-900 rounded-full"></div><div></div>
                </div>`;
            } else {
                return `<div class="w-full h-full flex items-center justify-center">
                    <div class="w-4 h-4 bg-slate-900 rounded-full"></div>
                </div>`;
            }
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            cardValues.forEach((val, idx) => {
                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'flex-1 max-w-[120px] aspect-[2/3]';

                cardWrapper.innerHTML = `
                    <button onclick="toggleCard(${idx})" id="card-${idx}" class="dot-card w-full h-full bg-slate-100 text-slate-900 rounded-2xl border-4 border-slate-300 p-2 flex flex-col justify-between items-center shadow-lg relative overflow-hidden group">
                        <span class="text-xs font-bold text-slate-500 font-mono">${val}點</span>
                        ${buildDotsHTML(val)}
                        <span class="text-[10px] font-mono font-bold bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded">按 ${idx + 1}</span>
                    </button>
                `;
                container.appendChild(cardWrapper);
            });
        }

        function toggleCard(index) {
            cardStates[index] = !cardStates[index];
            playTone(cardStates[index] ? 600 : 350, 60);
            updateUI();
        }

        function clearCards() {
            cardStates = [false, false, false, false, false];
            playTone(300, 80);
            updateUI();
        }

        function getCurrentSum() {
            return cardStates.reduce((sum, active, idx) => active ? sum + cardValues[idx] : sum, 0);
        }

        function updateUI() {
            // Update Card visual styles
            cardValues.forEach((val, idx) => {
                const cardEl = document.getElementById(`card-${idx}`);
                if (!cardEl) return;
                if (cardStates[idx]) {
                    cardEl.classList.add('selected');
                    cardEl.classList.remove('bg-slate-100', 'border-slate-300');
                    cardEl.classList.add('bg-emerald-50', 'border-emerald-500');
                } else {
                    cardEl.classList.remove('selected');
                    cardEl.classList.remove('bg-emerald-50', 'border-emerald-500');
                    cardEl.classList.add('bg-slate-100', 'border-slate-300');
                }
            });

            // Update Binary & Sum indicators
            const binStr = cardStates.map(b => b ? '1' : '0').join(' ');
            document.getElementById('binary-code-text').textContent = binStr;
            document.getElementById('current-sum-text').textContent = getCurrentSum();

            updateMorseVisual();
        }

        function updateMorseVisual() {
            const visualDisplay = document.getElementById('morse-symbols-display');
            if (!showHint) {
                visualDisplay.textContent = '🔒 已隱藏 (勾選上方「顯示波形符號」可看提示)';
                visualDisplay.className = "text-xs text-slate-500 font-sans italic";
                return;
            }

            const binStr = currentTargetNumber.toString(2).padStart(5, '0');
            const symbols = binStr.split('').map(b => b === '1' ? '➖ (長音)' : '▪ (短音)').join('  ');
            visualDisplay.textContent = symbols;
            visualDisplay.className = "font-bold text-lg text-amber-300 font-mono";
        }

        function nextTarget() {
            let nextNum;
            do {
                nextNum = Math.floor(Math.random() * 32);
            } while (nextNum === currentTargetNumber);

            currentTargetNumber = nextNum;
            cardStates = [false, false, false, false, false];
            updateUI();

            if (gameMode === 'listen') {
                document.getElementById('target-number-text').classList.add('hidden');
                document.getElementById('btn-play-sound').classList.remove('hidden');
                setTimeout(() => playCurrentMorseSequence(), 300);
            } else {
                document.getElementById('target-number-text').textContent = currentTargetNumber;
                document.getElementById('target-number-text').classList.remove('hidden');
                document.getElementById('btn-play-sound').classList.add('hidden');
            }
        }

        function submitAnswer() {
            const userSum = getCurrentSum();
            if (userSum === currentTargetNumber) {
                // Success!
                score += 10;
                streak += 1;
                document.getElementById('score-val').textContent = score;
                document.getElementById('streak-val').textContent = streak;

                // Success Sound Effect
                playTone(523, 80).then(() => playTone(659, 80)).then(() => playTone(784, 150));

                setTimeout(() => {
                    nextTarget();
                }, 500);
            } else {
                // Wrong
                streak = 0;
                document.getElementById('streak-val').textContent = streak;
                playTone(200, 250);

                // Shake animation or indicator
                const sumEl = document.getElementById('current-sum-text');
                sumEl.classList.add('text-rose-500');
                setTimeout(() => sumEl.classList.remove('text-rose-500'), 500);
            }
        }

        function switchMode(mode) {
            gameMode = mode;
            const btnListen = document.getElementById('btn-mode-listen');
            const btnTransmit = document.getElementById('btn-mode-transmit');
            const targetLabel = document.getElementById('target-label');

            if (mode === 'listen') {
                btnListen.className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-amber-500 text-slate-950 font-bold shadow";
                btnTransmit.className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition";
                targetLabel.textContent = "▶ 聽音解碼模式 (按按鈕或Space聽音)";
            } else {
                btnTransmit.className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-amber-500 text-slate-950 font-bold shadow";
                btnListen.className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition";
                targetLabel.textContent = "▶ 電報發射模式 (目標數字，請翻卡並發射聲音)";
            }

            nextTarget();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5') {
                toggleCard(parseInt(e.key) - 1);
            } else if (e.key.toLowerCase() === 'r') {
                clearCards();
            } else if (e.key === 'Enter') {
                submitAnswer();
            } else if (e.key === ' ') {
                e.preventDefault();
                if (gameMode === 'listen') {
                    playCurrentMorseSequence();
                } else {
                    playMorseSequence(getCurrentSum());
                }
            }
        });

        // Initialize Game
        window.onload = function() {
            renderCards();
            nextTarget();
        };
    </script>
</body>
</html>
